# SwiftLint for OfficeDaze.
#
# The rules here are the ones that catch real mistakes in a SwiftUI app:
# force-unwraps that crash, `count == 0` where `isEmpty` reads better,
# and bodies that have grown past the point of being read in one sitting.
# Style-only rules that would churn the diff without changing meaning are off.

included:
  - OfficeDaze
  - OfficeDazeTests

excluded:
  - OfficeDaze/Assets.xcassets

disabled_rules:
  - todo # TODOs are tracked in the repo, not shouted about by the linter.
  # The codebase uses trailing commas in multi-line literals throughout, which
  # is what keeps a one-element diff to one line. Swift 6.1 made them legal
  # nearly everywhere; the rule is arguing with a choice already made.
  - trailing_comma

opt_in_rules:
  - array_init
  - closure_spacing
  - collection_alignment
  - contains_over_filter_count
  - contains_over_first_not_nil
  - empty_count
  - empty_string
  - explicit_init
  - first_where
  - last_where
  - modifier_order
  - operator_usage_whitespace
  - overridden_super_call
  - prefer_self_type_over_type_of_self
  - redundant_nil_coalescing
  - sorted_first_last
  - toggle_bool
  - unneeded_parentheses_in_closure_argument
  - yoda_condition

# The burn-down is done. CI runs `swiftlint lint --strict`, which turns every
# warning into a failure, so the severities below no longer decide whether a
# build goes red — the thresholds do, and they are now the standard rather than
# a record of how much debt there was. The count reached zero on the commit that
# added --strict; keep it there.
#
# What that means in practice: a violation is not something to look at later. It
# fails the build, and the two honest answers are to fix the code or to argue
# here for the threshold being wrong. A third answer — a per-line
# `// swiftlint:disable:next` with a comment saying why — exists for the handful
# of places where the rule is right in general and wrong in one spot. There are
# five in the codebase, all `force_try`, all in a #Preview or in App.init.

# Interpolated lines are ignored outright — you cannot wrap `\(day.dayAndMonth)`
# without hiding it. Everything else wraps: prose in a `Text(...)` concatenates
# with `+` across lines rather than `\` continuations, where a missed backslash
# puts a real newline in the UI.
line_length:
  warning: 140
  error: 140
  ignores_comments: true
  ignores_urls: true
  ignores_interpolated_strings: true

# `try!` is deliberate and documented at each of the five sites that keep it:
# App.init cannot proceed without its store, and the #Preview containers are
# in-memory. Each carries its own `disable:next` and its own reason, so a new
# one has to be argued for rather than inherited.
force_try:
  severity: error

# Three-member tuples are the honest return type for a couple of the geometry
# and calendar helpers. Four is where it should have been a struct.
large_tuple:
  warning: 3
  error: 4

# SwiftUI view bodies and the screens that hold them are legitimately long.
# These thresholds are set where a file stops being one idea, not at the default
# that flags every screen in the app.
#
# The three that used to exceed them — HomeScreen at 1097 lines, OfficeEditor at
# 797, Settings at 692 — are split now, and the seam was already there in each:
# every one of those screens keeps its decisions in `static`s so they can be
# tested without a screen, and those statics are what moved into a sibling
# `extension` file. Nothing was cut to fit, and no call site changed, because an
# extension in the same module resolves exactly as the type did.
#
# `type_body_length` counts the type's own body, so the same move satisfies it:
# an extension's members are not counted against the struct they extend. That is
# also why the split has to follow the seam rather than a line count — moving an
# arbitrary 300 lines out would satisfy the linter and leave the file harder to
# read, which is the opposite of what the rule is for.
#
# Test files are exempt from both in OfficeDazeTests/.swiftlint.yml: a test file
# grows one @Test at a time and is read one @Test at a time.
file_length:
  warning: 600
  error: 600

type_body_length:
  warning: 400
  error: 400

function_body_length:
  warning: 100
  error: 200

# Case conventions still apply; the length floor does not. The Gauss Easter
# computation in BankHolidays.swift names its terms a…m because the published
# algorithm does, and renaming them would make it harder to check, not easier.
identifier_name:
  min_length: 1
  # `Day.month_` carries a trailing underscore to dodge its own `month` stored
  # property. Named here rather than allowing `_` everywhere, so the exception
  # stays one line long and visible instead of becoming a habit.
  excluded:
    - month_

nesting:
  type_level: 2
